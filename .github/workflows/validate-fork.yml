name: Validate integration fork
on:
  push:
    branches: [feat/integrated-v5.1.4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: node install.mjs build-manifest && git diff --exit-code -- core/manifest.json
      - run: node install.mjs doctor --target-dir .
      - run: node install.mjs pack
